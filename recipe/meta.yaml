{% set name = "pls" %}
{% set version = "6.0.0.post1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pls-{{ version }}.tar.gz
  sha256: 8d67418e0cc4a51985911b71592c97c922057a1f06fe07bca1a35d4c363e47a6

build:
  entry_points:
    - pls = pls.main:main
    - pls-dev = pls.main:dev
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - poetry-core >=1.0.0
    - python {{ python_min }}
  run:
    - python >={{ python_min }}
    - pyyaml >=6.0,<7.0
    - requests >=2.27.1,<3.0.0
    - rich >=12.5.1,<13.0.0

test:
  imports:
    - pls
  commands:
    - pip check
    - pls --help
    - pls-dev --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/dhruvkb/pls
  doc_url: https://dhruvkb.github.io/pls/
  summary: An improved ls for developers.
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - thewchan
