schema_version: 1

context:
  name: pls
  version: 6.0.0.post1

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pls-${{ version }}.tar.gz
  sha256: 8d67418e0cc4a51985911b71592c97c922057a1f06fe07bca1a35d4c363e47a6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - pls = pls.main:main
      - pls-dev = pls.main:dev

requirements:
  host:
    - pip
    - poetry-core >=1.0.0
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}
    - pyyaml >=6.0,<7.0
    - requests >=2.27.1,<3.0.0
    - rich >=12.5.1,<13.0.0

tests:
  - python:
      imports:
        - pls
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - pls --help
      - pls-dev --help

about:
  summary: An improved ls for developers.
  license: GPL-3.0-or-later
  license_file: LICENSE
  homepage: https://github.com/dhruvkb/pls
  documentation: https://dhruvkb.github.io/pls/

extra:
  recipe-maintainers:
    - thewchan
